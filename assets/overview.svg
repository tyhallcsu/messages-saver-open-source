  <text x="580" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#475569">The same capture buffer can become JSON, CSV, TXT, or a standalone HTML transcript.</text>

