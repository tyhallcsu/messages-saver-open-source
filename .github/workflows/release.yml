name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches manifest version
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$tag" != "v$manifest_version" ]; then
            echo "::error::Tag ($tag) does not match manifest.json version (v$manifest_version)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "version=$manifest_version" >> "$GITHUB_ENV"

      - name: Build extension zip
        run: |
          set -eu
          out="open-chat-archiver-${{ env.version }}.zip"
          # Ship only the files Chrome needs at runtime + LICENSE/README/PRIVACY.
          zip -r "$out" \
            manifest.json \
            background.js \
            content.js \
            content.css \
            popup.html popup.css popup.js \
            options.html options.css options.js \
            icons \
            LICENSE \
            README.md \
            PRIVACY.md
          ls -la "$out"
          echo "asset=$out" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "${{ env.tag }}" \
            "${{ env.asset }}" \
            --title "${{ env.tag }}" \
            --generate-notes
