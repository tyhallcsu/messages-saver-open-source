name: release

# Three ways to fire a release:
#   1. Push a commit to main that changes manifest.json's version  → auto-detect, tag, build, publish.
#   2. Push a tag matching v*.*.*                                  → tag must match manifest.json; build, publish.
#   3. Run "release" from the Actions tab (workflow_dispatch)      → uses current manifest.json version.
#
# All three paths run the reusable _validate.yml gate first. A failed gate aborts the publish.

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    name: Detect release trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      trigger: ${{ steps.check.outputs.trigger }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # fetch-depth: 2 lets us diff manifest.json against the previous main commit.

      - name: Decide whether to release
        id: check
        run: |
          set -eu
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          tag="v$version"

          should_release=false
          trigger=""

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            pushed_tag="${GITHUB_REF#refs/tags/}"
            pushed_version="${pushed_tag#v}"
            if [ "$pushed_version" != "$version" ]; then
              echo "::error::Pushed tag ${pushed_tag} does not match manifest.json version v${version}."
              exit 1
            fi
            trigger=tag
            should_release=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            trigger=dispatch
            should_release=true
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # Auto-release path: did manifest.json's version actually change on this push?
            old=$(git show HEAD~1:manifest.json 2>/dev/null \
              | python3 -c "import sys, json; print(json.load(sys.stdin)['version'])" 2>/dev/null \
              || echo "")
            if [ -n "$old" ] && [ "$version" != "$old" ]; then
              # Don't double-publish if a release already exists for this version.
              if git ls-remote --tags origin "$tag" | grep -q "refs/tags/$tag"; then
                echo "::warning::Tag $tag already exists on origin; skipping auto-release."
              else
                trigger=version_bump
                should_release=true
              fi
            fi
          fi

          echo "version=$version"           >> "$GITHUB_OUTPUT"
          echo "tag=$tag"                   >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger"           >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

          {
            echo "## Release detection"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| version | \`$version\` |"
            echo "| tag | \`$tag\` |"
            echo "| trigger | \`$trigger\` |"
            echo "| should_release | \`$should_release\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/_validate.yml

  release:
    name: Build and publish release
    needs: [detect, test]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for tag creation
        if: needs.detect.outputs.trigger != 'tag'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag (auto / dispatch paths only)
        if: needs.detect.outputs.trigger != 'tag'
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -eu
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
          else
            git tag "$TAG" "${{ github.sha }}"
          fi
          if git ls-remote --tags origin "$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on origin; not re-pushing."
          else
            git push origin "$TAG"
          fi

      - name: Compute release metadata
        id: meta
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -eu
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=open-chat-archiver-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build extension zip
        id: build
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -eu
          zip -r "$ASSET" \
            manifest.json \
            background.js \
            content.js \
            content.css \
            popup.html popup.css popup.js \
            options.html options.css options.js \
            icons \
            LICENSE \
            README.md \
            PRIVACY.md
          ls -la "$ASSET"
          sha256=$(shasum -a 256 "$ASSET" | awk '{print $1}')
          size=$(wc -c < "$ASSET" | tr -d ' ')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Build file manifest
        id: manifest
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -eu
          {
            echo 'file_manifest<<EOF'
            unzip -l "$ASSET" | awk 'NR>3 && NF>=4 && $1!="" && $4!="" {printf "%-12s  %s\n", $1, $4}' | sed '/^$/d' | head -n -2
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section for this version
        id: changelog
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          # Pull the section between "## [<version>]" and the next "## [" header.
          section=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md || true)
          if [ -z "$section" ]; then
            section="No CHANGELOG entry found for version ${VERSION}. See CHANGELOG.md."
          fi
          {
            echo 'section<<EOF'
            echo "$section"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compose release body
        id: body
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.build.outputs.size }}
          FILE_MANIFEST: ${{ steps.manifest.outputs.file_manifest }}
          CHANGELOG_SECTION: ${{ steps.changelog.outputs.section }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TRIGGER: ${{ needs.detect.outputs.trigger }}
        run: |
          set -eu
          size_kb=$(awk -v b="$SIZE_BYTES" 'BEGIN{printf "%.1f", b/1024}')
          {
            echo 'body<<RELEASE_EOF'
            echo "# Open Chat Archiver ${TAG}"
            echo ""
            echo "Manifest V3 Chrome extension that exports your own Facebook / Messenger conversations to JSON / CSV / TXT / HTML — locally, with zero network egress."
            echo ""
            echo "## Changes in this release"
            echo ""
            echo "${CHANGELOG_SECTION}"
            echo ""
            echo "## Install (developer mode)"
            echo ""
            echo "1. Download \`${ASSET}\` from the **Assets** section below."
            echo "2. Verify the SHA-256 (optional but recommended):"
            echo "   \`\`\`bash"
            echo "   shasum -a 256 ${ASSET}"
            echo "   # expected: ${SHA256}"
            echo "   \`\`\`"
            echo "3. Unzip into a folder you'll keep around (Chrome reads from disk)."
            echo "4. Open \`chrome://extensions\`."
            echo "5. Enable **Developer mode** (top-right toggle)."
            echo "6. Click **Load unpacked** and select the unzipped folder."
            echo "7. Pin the icon to your toolbar."
            echo ""
            echo "Updating from a previous version: remove the old extension at \`chrome://extensions\`, unzip the new release into a fresh folder, and **Load unpacked** again. Your saved options live in \`chrome.storage.local\` and are scoped to each loaded copy."
            echo ""
            echo "## Verify the extension before loading"
            echo ""
            echo "Before clicking **Load unpacked**, you can confirm there is no network egress:"
            echo ""
            echo "\`\`\`bash"
            echo "grep -REn 'fetch\\(|XMLHttpRequest|WebSocket\\(|navigator\\.sendBeacon|new EventSource|importScripts' \\\\"
            echo "  background.js content.js popup.js options.js"
            echo "# expected: no matches"
            echo "\`\`\`"
            echo ""
            echo "And confirm the manifest's host scope is narrow:"
            echo ""
            echo "\`\`\`bash"
            echo "python3 -c \"import json; print(json.load(open('manifest.json'))['host_permissions'])\""
            echo "# expected: only facebook.com / m.facebook.com / messenger.com — no <all_urls>, no *://*"
            echo "\`\`\`"
            echo ""
            echo "## How to use"
            echo ""
            echo "1. Open a conversation on \`messenger.com/t/<thread>\` or \`facebook.com/messages/t/<thread>\`."
            echo "2. Click the extension icon → **Start capture**."
            echo "3. Scroll up to load older messages (or enable paced auto-scroll in Options)."
            echo "4. Optionally set a **From** / **To** date range."
            echo "5. Pick a format and click **Download export**."
            echo ""
            echo "Full step-by-step walkthrough with troubleshooting: [docs/USAGE.md](https://github.com/${REPO}/blob/${TAG}/docs/USAGE.md)"
            echo ""
            echo "## Release artifact"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`${ASSET}\` |"
            echo "| Size | ${size_kb} KiB (${SIZE_BYTES} bytes) |"
            echo "| SHA-256 | \`${SHA256}\` |"
            echo "| Source commit | \`${SHA}\` |"
            echo "| Manifest version | \`${VERSION}\` |"
            echo "| Trigger | \`${TRIGGER}\` |"
            echo ""
            echo "### File manifest"
            echo ""
            echo "\`\`\`"
            echo "${FILE_MANIFEST}"
            echo "\`\`\`"
            echo ""
            echo "## Privacy and safety"
            echo ""
            echo "- No network egress — enforced in CI on every commit."
            echo "- No private API scraping; only the rendered DOM is read."
            echo "- Minimal permissions: \`storage\`, \`downloads\`, \`activeTab\`, narrow host scope."
            echo "- Full statement: [PRIVACY.md](https://github.com/${REPO}/blob/${TAG}/PRIVACY.md)"
            echo ""
            echo "## Reporting issues"
            echo ""
            echo "- Bug or capture regression: [open an issue](https://github.com/${REPO}/issues/new?template=bug_report.md)."
            echo "- Security concern: see [SECURITY.md](https://github.com/${REPO}/blob/${TAG}/SECURITY.md) — please use a private advisory, not a public issue."
            echo ""
            echo "---"
            echo ""
            echo "_Auto-generated commit history is appended below by GitHub._"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
          BODY: ${{ steps.body.outputs.body }}
        run: |
          set -eu
          printf '%s' "$BODY" > /tmp/release-body.md
          # Idempotent: if the release already exists (e.g. concurrent fire), upload the asset and update notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists; uploading asset and refreshing notes."
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes-file /tmp/release-body.md
          else
            gh release create "$TAG" \
              "$ASSET" \
              --title "$TAG" \
              --notes-file /tmp/release-body.md \
              --generate-notes
          fi
